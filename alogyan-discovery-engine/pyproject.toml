[project]
name = "alogyan-discovery-engine"
version = "2.0.0"
description = "Automated education discovery & lead intelligence engine"
requires-python = ">=3.12"
dependencies = [
    "scrapling[fetchers]>=0.4.15",
    "motor>=3.7.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "rapidfuzz>=3.14.6",
    "phonenumbers>=9.0.39",
    "tldextract>=5.3.2",
    "unidecode>=1.4.0",
    "trafilatura>=2.0.0",
    "beautifulsoup4>=4.13.0",
    "instructor>=1.7.0",
    "httpx>=0.28.1",
    "tenacity>=9.0.0",
    "python-dotenv>=1.2.3",
    "certifi>=2026.7.22",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
